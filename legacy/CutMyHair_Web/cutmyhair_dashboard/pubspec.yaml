name: cutmyhair_dashboard
description: "CutMyHair Barber Dashboard (Flutter Web)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase core packages
  firebase_core: ^3.4.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.4.0

  # Other packages
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  image_picker: ^1.0.7
  crop_your_image: ^0.6.0
  shimmer: ^2.0.0

  # Location and maps
  google_maps_flutter: ^2.5.0
  google_maps_flutter_web: ^0.5.6
  geolocator: ^12.0.0
  geolocator_web: ^4.1.3

  # UI & styling
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
