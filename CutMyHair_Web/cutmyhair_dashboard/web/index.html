<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="description" content="CutMyHair Barber Web Dashboard">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✅ Complete CSP for Firebase + Google Maps -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https://*.googleapis.com https://*.gstatic.com https://*.firebaseapp.com https://firebasestorage.googleapis.com https://maps.googleapis.com;
        img-src 'self' data: blob: https://firebasestorage.googleapis.com https://lh3.googleusercontent.com;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://maps.googleapis.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        connect-src 'self' https://*.googleapis.com https://firestore.googleapis.com https://firebasestorage.googleapis.com wss://*.firebaseio.com;
      "
    >

    <!-- ✅ iOS meta tags & PWA setup -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="CutMyHair Dashboard">

    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json">

    <!-- ✅ Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >

    <!-- ✅ Google Maps API -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD2nZ-_kFVaqxrwToYBmve-LzWtxKZV_Gg&callback=initMap&v=weekly&libraries=marker"
      defer
    ></script>

    <!-- ✅ Flutter bootstrap -->
    <script src="flutter_bootstrap.js" async></script>

    <title>CutMyHair Dashboard</title>
  </head>

  <body>
    <noscript>
      <p>Please enable JavaScript to run this application.</p>
    </noscript>
  </body>
</html>
